spring.application.name=MessangerMail
server.port=8081
spring.config.import=file:.env[.properties]

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=mail-messenger-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.properties.spring.json.use.type.headers=false
spring.kafka.properties.spring.json.value.default.type=com.yuldashov.messangermail.dto.EmailMessage

spring.mail.host=smtp.yandex.ru
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
